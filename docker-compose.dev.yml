services:
  next:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm dev
    env_file:
      - .env.local
    environment:
      SUPABASE_SERVER_URL: http://host.docker.internal:54321
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "3090:3090"
    volumes:
      - .:/app
      - next_node_modules:/app/node_modules
      - next_build_cache:/app/.next

volumes:
  next_node_modules:
  next_build_cache:
